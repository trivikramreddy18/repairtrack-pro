# MySQL Configuration for RepairTrack Pro
# Activate with: java -jar backend.jar --spring.profiles.active=mysql
# or: mvn spring-boot:run -Dspring-boot.run.profiles=mysql

spring.datasource.url=jdbc:mysql://localhost:3306/repairtrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console disabled in production/MySQL profile
spring.h2.console.enabled=false
