# RepairTrack Pro Backend Configuration

# Spring Profiles: default uses in-memory H2 (with MySQL mode) for instant setup
# To switch to real MySQL: run with --spring.profiles.active=mysql
spring.application.name=RepairTrackPro

# Default DataSource: H2 in MySQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:repairtrack_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=repairtrack
spring.datasource.password=RepairTrack@2024

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON Formatter
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging
logging.level.com.repairtrack=INFO
logging.level.org.springframework.web=INFO

server.port=${PORT:8080}
